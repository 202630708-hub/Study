<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스네이크 지뢰게임 (Snake Minesweeper)</title>
    <style>
        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 5px;
            color: #a6e3a1;
        }

        .instructions {
            font-size: 14px;
            color: #bac2de;
            margin-bottom: 15px;
            text-align: center;
        }

        #game-container {
            position: relative;
        }

        canvas {
            border: 4px solid #45475a;
            border-radius: 8px;
            background-color: #181825;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #ui {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 8px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f38ba8;
        }

        #game-over-screen h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        #restart-btn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #a6e3a1;
            color: #11111b;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        #restart-btn:hover {
            background-color: #94e2d5;
        }
    </style>
</head>
<body>

    <h1>💣 스네이크 지뢰게임 🐍</h1>
    <div class="instructions">
        방향키로 뱀을 움직이세요.<br>
        먹이에 표시된 <b>숫자</b>는 뱀 머리 주변 8칸 내의 <b>지뢰 개수</b>입니다!
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="game-over-screen">
            <h2 id="over-reason">게임 오버!</h2>
            <p>최종 점수: <span id="final-score">0</span></p>
            <button id="restart-btn" onclick="resetGame()">다시 시작</button>
        </div>
    </div>

    <div id="ui">
        <div>점수: <span id="score">0</span></div>
        <div>지뢰 수: <span id="mine-count">0</span></div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const GRID_SIZE = 20; // 20x20 격자
        const TILE_SIZE = canvas.width / GRID_SIZE;
        const MINE_COUNT = 15; // 설치할 지뢰 개수

        let snake = [];
        let dx = TILE_SIZE;
        let dy = 0;
        let food = { x: 0, y: 0 };
        let mines = [];
        let score = 0;
        let gameInterval;
        let isGameOver = false;

        function initGame() {
            // 뱀 초기화 (길이 3)
            snake = [
                { x: 5 * TILE_SIZE, y: 10 * TILE_SIZE },
                { x: 4 * TILE_SIZE, y: 10 * TILE_SIZE },
                { x: 3 * TILE_SIZE, y: 10 * TILE_SIZE }
            ];
            dx = TILE_SIZE;
            dy = 0;
            score = 0;
            isGameOver = false;
            document.getElementById("score").innerText = score;
            document.getElementById("mine-count").innerText = MINE_COUNT;
            document.getElementById("game-over-screen").style.display = "none";

            generateMines();
            generateFood();

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 130);
        }

        // 지뢰 랜던 배치
        function generateMines() {
            mines = [];
            while (mines.length < MINE_COUNT) {
                let mx = Math.floor(Math.random() * GRID_SIZE) * TILE_SIZE;
                let my = Math.floor(Math.random() * GRID_SIZE) * TILE_SIZE;

                // 뱀의 시작 위치 근처에는 지뢰 생성하지 않음
                let isNearSnake = snake.some(segment => Math.abs(segment.x - mx) <= TILE_SIZE * 2 && Math.abs(segment.y - my) <= TILE_SIZE * 2);
                let isDuplicate = mines.some(m => m.x === mx && m.y === my);

                if (!isNearSnake && !isDuplicate) {
                    mines.push({ x: mx, y: my });
                }
            }
        }

        // 먹이 랜덤 배치
        function generateFood() {
            while (true) {
                let fx = Math.floor(Math.random() * GRID_SIZE) * TILE_SIZE;
                let fy = Math.floor(Math.random() * GRID_SIZE) * TILE_SIZE;

                let onSnake = snake.some(s => s.x === fx && s.y === fy);
                let onMine = mines.some(m => m.x === fx && m.y === fy);

                if (!onSnake && !onMine) {
                    food = { x: fx, y: fy };
                    break;
                }
            }
        }

        // 뱀 머리 주변 8칸의 지뢰 개수 계산 (지뢰찾기 힌트 기능)
        function countSurroundingMines(headX, headY) {
            let count = 0;
            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    if (x === 0 && y === 0) continue;
                    let checkX = headX + x * TILE_SIZE;
                    let checkY = headY + y * TILE_SIZE;

                    if (mines.some(m => m.x === checkX && m.y === checkY)) {
                        count++;
                    }
                }
            }
            return count;
        }

        function gameLoop() {
            if (isGameOver) return;

            // 이동
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 1. 벽 충돌 체크
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return gameOver("벽에 부딪혔습니다!");
            }

            // 2. 자기 자신 몸통 충돌 체크
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                return gameOver("자기 몸에 부딪혔습니다!");
            }

            // 3. 지뢰 충돌 체크
            if (mines.some(m => m.x === head.x && m.y === head.y)) {
                return gameOver("💣 지뢰를 밟았습니다!");
            }

            snake.unshift(head);

            // 먹이를 먹었는지 체크
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById("score").innerText = score;
                generateFood();
            } else {
                snake.pop(); // 안 먹었으면 꼬리 지움
            }

            draw();
        }

        function draw() {
            // 배경 청소
            ctx.fillStyle = "#181825";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 그리드 그리기
            ctx.strokeStyle = "#313244";
            for (let i = 0; i < canvas.width; i += TILE_SIZE) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // 뱀 그리기
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? "#a6e3a1" : "#94e2d5"; // 머리는 밝은 연두
                ctx.fillRect(segment.x + 1, segment.y + 1, TILE_SIZE - 2, TILE_SIZE - 2);
            });

            // 먹이 그리기
            ctx.fillStyle = "#fab387";
            ctx.fillRect(food.x + 1, food.y + 1, TILE_SIZE - 2, TILE_SIZE - 2);

            // 지뢰 힌트 (뱀 머리 근처 지뢰 수 구해서 먹이 위치에 표시)
            const mineHint = countSurroundingMines(snake[0].x, snake[0].y);
            ctx.fillStyle = "#11111b";
            ctx.font = "bold 14px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(mineHint, food.x + TILE_SIZE / 2, food.y + TILE_SIZE / 2);
        }

        function gameOver(reason) {
            isGameOver = true;
            clearInterval(gameInterval);

            // 지뢰 위치 모두 보여주기
            draw();
            mines.forEach(m => {
                ctx.fillStyle = "#f38ba8";
                ctx.beginPath();
                ctx.arc(m.x + TILE_SIZE / 2, m.y + TILE_SIZE / 2, TILE_SIZE / 3, 0, Math.PI * 2);
                ctx.fill();
            });

            document.getElementById("over-reason").innerText = reason;
            document.getElementById("final-score").innerText = score;
            document.getElementById("game-over-screen").style.display = "flex";
        }

        function resetGame() {
            initGame();
        }

        // 키보드 입력 처리
        window.addEventListener("keydown", e => {
            switch (e.key) {
                case "ArrowUp":
                    if (dy === 0) { dx = 0; dy = -TILE_SIZE; }
                    break;
                case "ArrowDown":
                    if (dy === 0) { dx = 0; dy = TILE_SIZE; }
                    break;
                case "ArrowLeft":
                    if (dx === 0) { dx = -TILE_SIZE; dy = 0; }
                    break;
                case "ArrowRight":
                    if (dx === 0) { dx = TILE_SIZE; dy = 0; }
                    break;
            }
        });

        // 게임 시작
        initGame();
    </script>
</body>
</html>
